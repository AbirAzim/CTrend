# Reference App Platform spec — use when creating the app in the Dashboard
# (Import spec) or with `doctl apps create --spec .do/app.yaml` once.
#
# CI no longer pushes this spec on every deploy (see deploy-digitalocean.yml).
# Set secrets in DigitalOcean → your app → Settings → Environment Variables
# for the api component: JWT_SECRET, MONGODB_URI, CORS_ORIGIN, FRONTEND_URL,
# Stripe, Google, SMTP, etc.
#
# Replace github.repo `${GITHUB_REPOSITORY}` with owner/repo manually if importing from file.
# Tune region/instance for cost: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: ctrend-app
region: nyc

services:
  - name: api
    github:
      repo: REPLACE_OWNER/REPLACE_REPO
      branch: main
      deploy_on_push: false
    build_command: npm ci --legacy-peer-deps && npm run build
    run_command: npm run start:prod
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
