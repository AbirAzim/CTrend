# DigitalOcean App Platform via official deploy action (.do/app.yaml).
# Runs build + tests, then ships with digitalocean/app_action/deploy@v2.
#
# Repo secrets required:
#   DIGITALOCEAN_ACCESS_TOKEN — https://docs.digitalocean.com/reference/api/create-personal-access-token/
#   JWT_SECRET, MONGODB_URI    — CTrend runtime
#
# Optional: add `project_id:` under `with:` using `vars.DIGITALOCEAN_PROJECT_ID`
# when you don't want the default DigitalOcean project.

name: Deploy to DigitalOcean

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Verify deploy secrets exist (JWT + MongoDB)
        env:
          JWT_SET: ${{ secrets.JWT_SECRET != '' }}
          MONGO_SET: ${{ secrets.MONGODB_URI != '' }}
        run: |
          if [ "$JWT_SET" != "true" ] || [ "$MONGO_SET" != "true" ]; then
            echo "::error::Add non-empty repository secrets JWT_SECRET and MONGODB_URI (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Deploy App Platform app
        uses: digitalocean/app_action/deploy@v2
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          print_build_logs: true
          print_deploy_logs: true
