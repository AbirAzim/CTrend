# Builds + tests locally in CI, then triggers an App Platform *deployment* without
# re-applying `.do/app.yaml`. That keeps env vars you set in the DigitalOcean
# Dashboard (JWT_SECRET, MONGODB_URI, etc.) from being overwritten each push.
#
# GitHub Actions secrets:
#   DIGITALOCEAN_ACCESS_TOKEN — PAT with App access
#   DIGITALOCEAN_APP_ID       — Apps → your app → URL .../apps/<uuid>/...

name: Deploy to DigitalOcean

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger deployment (preserves Dashboard env vars)
        run: |
          if [ -z "${{ secrets.DIGITALOCEAN_APP_ID }}" ]; then
            echo "::error::Set repository secret DIGITALOCEAN_APP_ID (UUID from Apps → Overview URL)."
            exit 1
          fi
          doctl apps create-deployment "${{ secrets.DIGITALOCEAN_APP_ID }}"
