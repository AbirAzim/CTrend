  matchesPlayed: Int!
  name: String!
  playerId: Int
  team: String!
  teamCrest: String
}

type TopScorerGql {
  goals: Int!
  matchesPlayed: Int!
  name: String!
  playerId: Int
  team: String!
  teamCrest: String
}

type TypingIndicatorGql {
  conversationId: ID!
  isTyping: Boolean!
  userId: ID!
}

input UpdateCampaignInput {
  bannerImageUrl: String
  bannerText: String
  ctaLabel: String
  ctaUrl: String
  endDate: DateTime
  fixturesEnabled: Boolean
  hasRewards: Boolean
  hasWinner: Boolean
  isActive: Boolean
  isDefault: Boolean
  isPublic: Boolean
  name: String
  prizePerWinner: Int
  rules: String
  rulesBn: String
  startDate: DateTime
}

input UpdatePostInput {
  broadcastGlobally: Boolean
  campaignId: String
  caption: String
  categoryId: String
  endingSoonLeadMinutes: Int
  imageUrls: [String!]
  options: [PostOptionInput!]
  resetVotes: Boolean
  scheduledAt: String
  votingEndsAt: String
}

input UpdateProfileInput {
  bio: String
  displayName: String
  interests: [String!]
  messageSoundId: String
  notificationSoundId: String
  profileImageUrl: String
  voteSoundId: String
}

type UserGql {
  bio: String
  coins: Int
  createdAt: DateTime!
  displayName: String
  email: String!
  emailVerified: Boolean!
  id: ID!
  interests: [String!]!
  messageSoundId: String
  notificationSoundId: String
  profileImageUrl: String
  role: UserRole!
  roles: [UserRole!]!
  username: String!
  voteSoundId: String
}

enum UserRole {
  ADMIN
  ORG
  USER
}

enum Visibility {
  PRIVATE
  PUBLIC
}

type VoteOptionStatGql {
  count: Float!
  index: Int!
  label: String!
  percentage: Float!
}

type VoteResultGql {
  countsPerOption: [Int!]!
  percentages: [Float!]!
  postId: ID!
  totalVotes: Int!
}

type VoteUpdateGql {
  countsPerOption: [Int!]!
  percentages: [Float!]!
  postId: ID!
  totalVotes: Int!
}